<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101019">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101019;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 5vw, 4rem);
      background: radial-gradient(ellipse at 65% 105%, #282040, transparent 64%), #101019;
    }

    main {
      isolation: isolate;
      position: relative;
      display: grid;
      align-items: end;
      overflow: hidden;
      width: min(100%, 70rem);
      min-height: clamp(23rem, 70svh, 43rem);
      padding: clamp(1.5rem, 6vw, 5rem);
      border: 1px solid #ffffff26;
      border-radius: clamp(1.25rem, 4vw, 2.5rem);
      background:
        radial-gradient(ellipse at 80% 14%, #622d7a88, transparent 55%),
        linear-gradient(140deg, #211d34, #161525 72%);
      box-shadow: 0 2rem 6rem #08070e88;
    }

    .orb {
      position: absolute;
      z-index: -1;
      top: 8%;
      right: 9%;
      width: clamp(12rem, 45vw, 29rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        repeating-radial-gradient(ellipse at 34% 29%, transparent 0 7px, #fff2 8px, transparent 9px 13px),
        radial-gradient(circle at 30% 20%, #ffdcad, #fa87b4 25%, #a754e3 52%, #38286d 74%, #171529 87%);
      box-shadow: 0 0 5rem #df82ff40, inset -1rem -1rem 3rem #12102088;
      animation: drift 9s ease-in-out infinite alternate;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 38% -16%;
      border: 1px solid #f3c7ff88;
      border-radius: 50%;
      transform: rotate(-26deg);
      box-shadow: 0 0 1rem #deb0ff66;
    }

    h1 {
      margin: 0;
      color: #fff4f8;
      font-family: Georgia, serif;
      font-size: clamp(3.4rem, 10vw, 9rem);
      font-weight: 400;
      letter-spacing: -.075em;
      line-height: .92;
      text-shadow: 0 .12em .6em #141025aa;
    }

    h1 span { display: block; color: #ffe1bd; font-style: italic; }

    @keyframes drift {
      to { transform: translateY(1rem) rotate(5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <h1>Hello, <span>World!</span></h1>
  </main>
</body>
</html>
